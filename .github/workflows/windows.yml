name: 构建 Windows 安装包

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - uses: actions/upload-artifact@v6
        with:
          name: ArticleRelay-Windows-x64
          path: release/ArticleRelay-*-Windows-x64.exe
          if-no-files-found: error
