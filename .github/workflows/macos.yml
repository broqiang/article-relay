name: 构建 macOS 安装包

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 构建内测安装包
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: npm run build:mac:dmg -- "--$TARGET_ARCH" -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false
      - name: 签名并公证发布安装包
        if: github.event_name == 'push'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo '::error::发布标签必须与 package.json 中的版本匹配。'
            exit 1
          fi
          if [[ -z "$CSC_LINK" || -z "$APPLE_API_KEY_CONTENT" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER" ]]; then
            echo '::error::缺少 macOS 签名或公证凭证。请查看 README 中的发布说明。'
            exit 1
          fi
          export APPLE_API_KEY="$RUNNER_TEMP/article-relay-notarize.p8"
          trap 'rm -f -- "$APPLE_API_KEY"' EXIT
          (umask 077; printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY")
          npm run build:mac:dmg -- "--$TARGET_ARCH" -c.forceCodeSigning=true
          app_dir=release/mac
          if [[ "$TARGET_ARCH" == 'arm64' ]]; then app_dir=release/mac-arm64; fi
          xcrun stapler validate "$app_dir/文章同步.app"
      - uses: actions/upload-artifact@v6
        with:
          name: ArticleRelay-macOS-${{ matrix.arch }}
          path: release/ArticleRelay-*-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: ArticleRelay-macOS-*
          path: release
          merge-multiple: true
      - name: 创建 GitHub Release 草稿
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=${GITHUB_REF_NAME#v}
          images=("release/ArticleRelay-$version-macOS-arm64.dmg" "release/ArticleRelay-$version-macOS-x64.dmg")
          for image in "${images[@]}"; do test -f "$image"; done
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != 'true' ]]; then
              echo '::error::此版本已经公开发布。请使用新版本标签。'
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${images[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${images[@]}" --draft --verify-tag --generate-notes --title "Article Relay $GITHUB_REF_NAME"
          fi
