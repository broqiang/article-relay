<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>文章同步</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <img class="brand-mark" src="icon.svg" alt="" width="38" height="38">
    <h1>文章同步</h1>
    <div class="app-actions">
      <a class="help-link quiet" href="help.html" target="_blank" rel="noopener" aria-label="帮助（在新窗口打开）">帮助</a>
      <button id="open-releases" type="button" class="release-link" title="查看 GitHub 发布页" hidden>
        <svg class="button-icon" aria-hidden="true"><use href="button-icons.svg#tag"></use></svg>
        <span id="app-version"></span>
        <span id="update-badge" class="update-badge" hidden>有新版本</span>
      </button>
      <button id="open-repository" type="button" class="quiet icon-button" aria-label="GitHub 代码仓库" title="GitHub 代码仓库" disabled>
        <img src="github.svg" width="20" height="20" alt="">
      </button>
      <button id="open-settings" type="button" class="quiet icon-button" popovertarget="settings-popover" aria-label="设置" title="设置" disabled>
        <svg width="20" height="20" viewBox="0 2 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 3h4l.5 2.6.8.5 2.5-.9 2.8 2.8-.9 2.5.5.8 2.6.7v4l-2.6.5-.5.8.9 2.5-2.8 2.8-2.5-.9-.8.5L14 25h-4l-.5-2.6-.8-.5-2.5.9-2.8-2.8.9-2.5-.5-.8L1 16v-4l2.6-.5.5-.8-.9-2.5L6 5.4l2.5.9.8-.5L10 3Z"></path>
          <circle cx="12" cy="14" r="3"></circle>
        </svg>
      </button>
      <div id="settings-popover" class="settings-popover" popover="auto" role="group" aria-label="设置">
        <button id="restart" type="button" class="quiet"><svg class="button-icon" aria-hidden="true"><use href="button-icons.svg#restart"></use></svg>重启应用</button>
        <p id="settings-status" class="status error" role="status"></p>
      </div>
    </div>
  </header>
  <main class="workspace">
    <aside class="sidebar">
      <button id="open-accounts" type="button" class="account-entry">
        <svg class="button-icon" aria-hidden="true"><use href="button-icons.svg#account"></use></svg>
        <strong>发布账号</strong><span class="account-arrow" aria-hidden="true">›</span>
        <small id="account-summary">正在检查登录状态…</small>
      </button>
      <section class="task-section" aria-labelledby="task-list-heading">
        <div class="task-section-heading">
          <h2 id="task-list-heading">文章任务</h2>
          <button id="open-import" type="button" class="primary"><svg class="button-icon" aria-hidden="true"><use href="button-icons.svg#import"></use></svg>导入文章</button>
        </div>
        <p class="muted" id="no-tasks">暂无记录</p>
        <ul class="task-list" id="task-list"></ul>
      </section>
    </aside>
    <section class="stage" aria-labelledby="workspace-heading">
      <div class="stage-bar">
        <h2 id="workspace-heading">同步工作区</h2>
        <p id="browser-status" class="status" role="status" hidden></p>
        <div class="stage-actions">
          <button id="continue" type="button" class="primary" hidden><svg class="button-icon" aria-hidden="true"><use href="button-icons.svg#continue"></use></svg>继续读取文章</button>
          <button id="back" type="button" class="quiet" hidden><svg class="button-icon" aria-hidden="true"><use href="button-icons.svg#back"></use></svg><span id="back-label">返回</span></button>
        </div>
      </div>
      <div class="stage-content" id="article-workspace">
        <section class="panel" aria-label="文章详情">
          <p id="no-article" class="muted">点击左侧「导入文章」添加公众号文章。</p>
          <div id="summary" class="summary" hidden>
            <div class="article-heading">
              <h3 id="task-title"></h3>
              <span class="result-status" id="task-status"></span>
            </div>
            <p class="source-link muted" id="task-source"></p>
            <p id="import-extraction" class="muted"></p>
            <p id="import-progress"></p>
            <progress id="download-progress" aria-label="图片下载进度" hidden></progress>
            <div class="result-actions">
              <button id="publish-all" type="button" class="primary"><svg class="button-icon" aria-hidden="true"><use href="button-icons.svg#publish"></use></svg>一键发布</button>
              <button id="retry-import" type="button" class="secondary" hidden><svg class="button-icon" aria-hidden="true"><use href="button-icons.svg#continue"></use></svg>继续导入</button>
              <button id="refresh-import" type="button" class="quiet" hidden><svg class="button-icon" aria-hidden="true"><use href="button-icons.svg#restart"></use></svg>重新导入原文</button>
              <button id="delete-task" type="button" class="quiet danger"><svg class="button-icon" aria-hidden="true"><use href="button-icons.svg#trash"></use></svg>删除任务</button>
            </div>
          </div>
          <p id="status" class="status" role="status"></p>
        </section>
        <section class="panel" id="platform-results" aria-labelledby="platform-heading" hidden>
          <h3 id="platform-heading">平台发布</h3>
          <div id="platform-list"></div>
        </section>
      </div>
      <div class="stage-content" id="import-workspace" hidden>
        <div class="panel">
          <form id="source-form">
            <label for="source-url">微信公众号文章链接</label>
            <div class="source-form-row">
              <input id="source-url" type="url" placeholder="粘贴微信公众号文章链接" required>
              <button type="submit" class="primary"><svg class="button-icon" aria-hidden="true"><use href="button-icons.svg#import"></use></svg>导入文章</button>
            </div>
            <p id="import-status" class="status" role="status"></p>
          </form>
        </div>
      </div>
      <div class="stage-content" id="accounts-workspace" hidden>
        <section class="panel" aria-labelledby="accounts-heading">
          <h3 id="accounts-heading">账号列表</h3>
          <div id="account-list"></div>
          <p id="account-status" class="status" role="status"></p>
        </section>
      </div>
    </section>
  </main>
  <dialog id="juejin-defaults-dialog" aria-labelledby="juejin-defaults-heading" aria-describedby="juejin-defaults-account">
    <form id="juejin-defaults-form">
      <header class="juejin-defaults-header">
        <h3 id="juejin-defaults-heading" tabindex="-1" autofocus>掘金发布默认值</h3>
        <p id="juejin-defaults-account" class="muted"></p>
      </header>
      <div class="juejin-defaults-body">
        <div class="juejin-defaults-field">
          <label for="juejin-category">默认分类</label>
          <select id="juejin-category" required></select>
        </div>
        <div class="juejin-defaults-field">
          <label for="juejin-tag-query">默认标签</label>
          <div id="juejin-selected-tags" class="juejin-tag-list" role="group" aria-label="已选标签"></div>
          <div class="juejin-tag-search">
            <input id="juejin-tag-query" type="search" placeholder="输入标签名称" maxlength="100">
            <button id="juejin-search-tags" type="button" class="secondary"><svg class="button-icon" aria-hidden="true"><use href="button-icons.svg#search"></use></svg>搜索</button>
          </div>
          <div id="juejin-tag-results" class="juejin-tag-list" role="group" aria-label="标签搜索结果"></div>
        </div>
        <p id="juejin-defaults-status" class="status" role="status"></p>
      </div>
      <footer class="juejin-defaults-footer">
        <button id="juejin-close-defaults" type="button" class="quiet">取消</button>
        <button id="juejin-save-defaults" type="submit" class="primary">保存</button>
      </footer>
    </form>
  </dialog>
</body>
</html>
